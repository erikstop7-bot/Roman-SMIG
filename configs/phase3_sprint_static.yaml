simulation_config_path: smig/config/simulation_science.yaml
output_dir: outputs/phase3_sprint_static
n_events: 10000
shard_size: 500
n_workers: 4                # raise on cluster
n_science_epochs: 30
# cadence_days: decimated Roman bulge "season" — 30 × 2.5 d = 72.5 d window.
# Must match phase3_sprint_lom_source.yaml so the static and LOM corpora
# share the same epoch grid (otherwise per-epoch comparisons are undefined).
cadence_days: 2.5
observation_start_mjd: 60000.0
sky_background_e_per_s: 0.5
master_seed: 20260416
field_center_l_deg: 1.0
field_center_b_deg: -3.0
catalog_provider: synthetic
strict_ld_grid: false
event_class_distribution:
  PSPL: 0.20                # 2000
  FSPL_STAR: 0.05           # 500
  PLANETARY_CAUSTIC: 0.40   # 4000 (covers the "long-tE" slice via filtering)
  STELLAR_BINARY: 0.25      # 2500
  HIGH_MAGNIFICATION_CUSP: 0.10  # 1000
